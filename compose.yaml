name: llm-observatory

services:
  observatory-api:
    build:
      context: .
    image: ${OBSERVATORY_API_IMAGE:-llm-observatory-api:0.1.0}
    command: ["python", "-m", "observatory.cli", "--state-dir", "/var/lib/observatory", "run-api", "--host", "0.0.0.0", "--allow-remote", "--allow-insecure-remote", "--port", "8787", "--max-database-bytes", "${OBSERVATORY_MAX_DATABASE_BYTES:-2147483648}"]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - ${OBSERVATORY_STATE_DIR:?Run observatory install before starting Compose}:/var/lib/observatory
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5}
    command: ["--config=/etc/otelcol/config.yaml"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      otel-queue-init:
        condition: service_completed_successfully
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - ./deployment/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - otel-queue:/var/lib/otelcol
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    expose:
      - "8888"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-queue-init:
    image: ${ALPINE_IMAGE:-alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1}
    command: ["sh", "-c", "install -d -o 10001 -g 10001 -m 0700 /var/lib/otelcol/file_storage && chown -R 10001:10001 /var/lib/otelcol"]
    restart: "no"
    mem_limit: 64m
    cpus: 0.10
    volumes:
      - otel-queue:/var/lib/otelcol

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo@sha256:78439f7f7cf3c97122846c13a832e060c6c7ef67dcc814dccf0a5f3f78393a93}
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 1.0
    environment:
      TEMPO_RETENTION: ${TEMPO_RETENTION:-720h}
    volumes:
      - ./deployment/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    expose:
      - "3200"
      - "4317"
      - "4318"
    healthcheck:
      test: ["CMD", "/tempo", "-health=true", "-health.url=http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  loki:
    image: ${LOKI_IMAGE:-grafana/loki@sha256:4c431d2e6b9b38718694b31c5d56be7c80dc69c513215fde1aeb5b02cd4e2665}
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-336h}
    volumes:
      - ./deployment/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    expose:
      - "3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3100/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}", "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}"]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3000
    secrets:
      - grafana_admin_password
    volumes:
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  otel-queue:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:

secrets:
  grafana_admin_password:
    file: ${OBSERVATORY_SECRET_FILE:?Run observatory install before starting Compose}
