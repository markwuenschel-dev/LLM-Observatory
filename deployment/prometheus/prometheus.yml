global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: observatory-read-api
    static_configs:
      - targets: [host.docker.internal:8788]
    authorization:
      credentials_file: /run/secrets/observatory_api_token
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: otel-collector-internal
    static_configs:
      - targets: [otel-collector:8888]
