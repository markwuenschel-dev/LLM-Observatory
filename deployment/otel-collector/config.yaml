extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    check_collector_pipeline:
      enabled: true
      interval: 5s
      exporter_failure_threshold: 5
  file_storage:
    directory: /var/lib/otelcol
    timeout: 1s
    max_size: 268435456
    fsync: true
    compaction:
      on_start: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 8388608

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource/observatory:
    attributes:
      - action: upsert
        key: llm.observatory.telemetry_plane
        value: out_of_band
      - action: upsert
        key: llm.observatory.normalization.version
        value: "1.0"
  resource/privacy:
    attributes:
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.tool.call.arguments
        action: delete
      - key: gen_ai.tool.call.result
        action: delete
      - key: gen_ai.request.body
        action: delete
      - key: gen_ai.response.body
        action: delete
      - key: llm.observatory.raw_api_body
        action: delete
      - key: llm.observatory.prompt
        action: delete
      - key: llm.observatory.completion
        action: delete
      - key: authorization
        action: delete
      - key: api_key
        action: delete
      - key: api_token
        action: delete
      - key: access_token
        action: delete
      - key: session_token
        action: delete
      - key: private_key
        action: delete
      - key: llm.observatory.project.root
        action: delete
      - key: llm.observatory.project.path
        action: delete
      - key: llm.observatory.project.remote
        action: delete
      - key: llm.observatory.cwd
        action: delete
      - key: llm.observatory.repository.root
        action: delete
      - key: llm.observatory.worktree.path
        action: delete
      - key: cwd
        action: delete
      - key: current_working_directory
        action: delete
      - key: file.path
        action: delete
      - key: code.filepath
        action: delete
      - key: code.file.path
        action: delete
      - key: process.command_line
        action: delete
      - key: process.executable.path
        action: delete
      - key: error.message
        action: delete
  attributes/privacy:
    actions:
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.tool.call.arguments
        action: delete
      - key: gen_ai.tool.call.result
        action: delete
      - key: llm.observatory.prompt
        action: delete
      - key: llm.observatory.completion
        action: delete
      - key: llm.observatory.content
        action: delete
      - key: llm.observatory.raw_api_body
        action: delete
      - key: gen_ai.prompt_text
        action: delete
      - key: gen_ai.request.body
        action: delete
      - key: gen_ai.response.body
        action: delete
      - key: gen_ai.input_text
        action: delete
      - key: gen_ai.output_text
        action: delete
      - key: gen_ai.tool.input
        action: delete
      - key: gen_ai.tool.output
        action: delete
      - key: llm.observatory.prompt_text
        action: delete
      - key: llm.observatory.response_body
        action: delete
      - key: llm.observatory.raw_prompt
        action: delete
      - key: llm.observatory.raw_completion
        action: delete
      - key: llm.observatory.request_body
        action: delete
      - key: llm.observatory.input_text
        action: delete
      - key: llm.observatory.output_text
        action: delete
      - key: llm.observatory.tool_input
        action: delete
      - key: llm.observatory.tool_output
        action: delete
      - key: llm.observatory.tool_result
        action: delete
      - key: llm.observatory.tool_arguments
        action: delete
      - key: llm.observatory.body
        action: delete
      - key: llm.observatory.response
        action: delete
      - key: authorization
        action: delete
      - key: api_key
        action: delete
      - key: api_token
        action: delete
      - key: access_token
        action: delete
      - key: session_token
        action: delete
      - key: id_token
        action: delete
      - key: private_key
        action: delete
      - key: signing_key
        action: delete
      - key: llm.observatory.project.root
        action: delete
      - key: llm.observatory.project.path
        action: delete
      - key: llm.observatory.project.remote
        action: delete
      - key: llm.observatory.cwd
        action: delete
      - key: llm.observatory.repository.root
        action: delete
      - key: llm.observatory.worktree.path
        action: delete
      - key: cwd
        action: delete
      - key: current_working_directory
        action: delete
      - key: file.path
        action: delete
      - key: code.filepath
        action: delete
      - key: code.file.path
        action: delete
      - key: process.command_line
        action: delete
      - key: process.executable.path
        action: delete
      - key: error.message
        action: delete
  transform/privacy:
    error_mode: ignore
    trace_statements:
      - context: spanevent
        statements:
          - set(attributes["gen_ai.prompt"], "[CONTENT_REDACTED]") where attributes["gen_ai.prompt"] != nil
          - set(attributes["gen_ai.completion"], "[CONTENT_REDACTED]") where attributes["gen_ai.completion"] != nil
          - set(attributes["gen_ai.input.messages"], "[CONTENT_REDACTED]") where attributes["gen_ai.input.messages"] != nil
          - set(attributes["gen_ai.output.messages"], "[CONTENT_REDACTED]") where attributes["gen_ai.output.messages"] != nil
          - set(attributes["gen_ai.tool.call.arguments"], "[CONTENT_REDACTED]") where attributes["gen_ai.tool.call.arguments"] != nil
          - set(attributes["gen_ai.tool.call.result"], "[CONTENT_REDACTED]") where attributes["gen_ai.tool.call.result"] != nil
          - set(attributes["gen_ai.request.body"], "[CONTENT_REDACTED]") where attributes["gen_ai.request.body"] != nil
          - set(attributes["gen_ai.response.body"], "[CONTENT_REDACTED]") where attributes["gen_ai.response.body"] != nil
          - set(attributes["llm.observatory.raw_api_body"], "[CONTENT_REDACTED]") where attributes["llm.observatory.raw_api_body"] != nil
    log_statements:
      - context: log
        statements:
          - set(log.body, "[CONTENT_REDACTED]")
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      storage: file_storage
      num_consumers: 2
      queue_size: 1024
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 512
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s
  otlphttp/normalizer:
    endpoint: http://observatory-api:8787
    encoding: json
    compression: none
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 1024
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  extensions: [health_check, file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/observatory, resource/privacy, attributes/privacy, transform/privacy, batch]
      exporters: [otlp/tempo, otlphttp/normalizer]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/observatory, resource/privacy, attributes/privacy, batch]
      exporters: [prometheus, otlphttp/normalizer]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/observatory, resource/privacy, attributes/privacy, transform/privacy, batch]
      exporters: [otlphttp/loki, otlphttp/normalizer]
