apiVersion: 1

datasources:
  # The default Prometheus-compatible source is the read-only event-time
  # facade on the normalizer.  It makes Grafana's time picker filter
  # observed_at rather than the scrape timestamp of a current snapshot.
  - name: Observatory Events
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://observatory-api:8787
    isDefault: true
    jsonData:
      httpMethod: POST
  # Collector self-metrics retain the real Prometheus backend and are kept
  # explicit on Reliability panels so telemetry-plane health remains visible.
  - name: Prometheus
    uid: system-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      httpMethod: POST
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: true
      tracesToMetrics:
        datasourceUid: system-prometheus
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
