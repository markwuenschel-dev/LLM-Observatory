[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-observatory"
version = "0.1.0"
description = "Provider-agnostic, metadata-first observability for LLM-assisted development"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "LLM Observatory maintainers"}]
dependencies = []

[project.scripts]
observatory = "observatory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
observatory = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

